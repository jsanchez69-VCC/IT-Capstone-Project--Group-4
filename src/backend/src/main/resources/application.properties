spring.application.name=onboarding-backend

# H2 in-memory database (swap for MySQL/Postgres later - see comments below)
spring.datasource.url=jdbc:h2:mem:onboardingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# To switch to MySQL for team deployment, replace the above with something like:
# spring.datasource.url=jdbc:mysql://localhost:3306/onboarding_db
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# (and add the mysql-connector-j dependency to pom.xml)

server.port=8081

# Frontend addresses allowed to call this API from the browser (comma-separated).
# Add your frontend's address here if it is not listed (for example http://localhost:5000).
app.cors.allowed-origins=https://localhost:7252,http://localhost:7252,http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500

# Creates three demo login accounts on startup so the frontend can be tested after every restart
# (the in-memory database is empty each time). SET THIS TO false BEFORE ANY REAL DEPLOYMENT.
app.seed-demo-data=true
